[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rugyomi"
version = "0.0.1"
description = "Risk analytics for token launches on NEAR launchpads (nearly.trade, justhoot.fun)"
requires-python = ">=3.12"
dependencies = []          # standard library only
license = { file = "LICENSE" }

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
rugyomi-collector = "rugyomi.collector:main"

[tool.setuptools.packages.find]
include = ["rugyomi*"]
